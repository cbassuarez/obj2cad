[package]
name = "obj2cad-core"
description = "Strict, lossless Wavefront OBJ parser and mesh model for obj2cad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
obj2cad-acis = { path = "../obj2cad-acis" }
serde.workspace = true
sha2.workspace = true
memchr = "2"
# Texture images, decoded the same way in the CLI and the browser.
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"

[dev-dependencies]
proptest = "1"
obj2cad-dxf = { path = "../obj2cad-dxf" }
