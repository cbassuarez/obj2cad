# No SIMD on purpose: measured no gain for obj2cad (parse, write and preview within noise
# of the SIMD build), and without it the engine runs in every browser with WebAssembly.
# getrandom (through acadrust's hash maps) takes randomness from the browser's Web Crypto.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
